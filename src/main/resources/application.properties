# ===================================================================
# Spring Boot Configuration - Customer Relationship Manager (CRM)
# ===================================================================

# Application Name
spring.application.name=crm-app

# Server Configuration
server.port=${SERVER_PORT:8080}

# ===================================================================
# MySQL Relational Database Configuration
# Overridable using environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Spring Data JPA / Hibernate ORM Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Note: 'update' is for local development only. Production must use Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Thymeleaf View Engine Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.example.crm=DEBUG
logging.level.org.hibernate.SQL=INFO
