# ===================================================================
# Test Configuration - In-Memory H2 Database
# Provides isolated, self-contained automated testing without MySQL
# ===================================================================

spring.application.name=crm-test

# In-Memory H2 Database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:crm_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate schema auto-generation for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf caching disabled for tests
spring.thymeleaf.cache=false

# Logging in test
logging.level.root=WARN
logging.level.com.example.crm=INFO
